<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img" aria-labelledby="t d">
<title id="t">El reloj de 6</title><desc id="d">Que 6 pertenezca sólo depende del resto de b al dividir por 6: sirven 0, 1, 3 y 4.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#1f2933}
  .m{fill:#6b7785}.s{font-size:13px}.xs{font-size:11px}
  .lbl{font-size:14px;font-weight:600}
  .big{font-size:20px;font-weight:700}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){
    text{fill:#e4e7eb}.m{fill:#9aa5b1}
    .stroke{stroke:#7b8794}
  }
</style>

<text class="xs m" x="150" y="26" text-anchor="middle">Sólo importa el RESTO de b al dividir por 6</text>
<circle cx="150" cy="155" r="92" fill="none" stroke="#9aa5b1" stroke-width="1.5" opacity="0.6" class="stroke"/>
<circle cx="150.0" cy="63.0" r="21" fill="none" stroke="#2e7d52" stroke-width="2.5" class="stroke"/>
<text class="lbl" x="150.0" y="68.0" text-anchor="middle" opacity="1">0</text>
<circle cx="229.7" cy="109.0" r="21" fill="none" stroke="#2e7d52" stroke-width="2.5" class="stroke"/>
<text class="lbl" x="229.7" y="114.0" text-anchor="middle" opacity="1">1</text>
<circle cx="229.7" cy="201.0" r="21" fill="none" stroke="#9aa5b1" stroke-width="1.5" class="stroke"/>
<text class="lbl" x="229.7" y="206.0" text-anchor="middle" opacity="0.45">2</text>
<circle cx="150.0" cy="247.0" r="21" fill="none" stroke="#2e7d52" stroke-width="2.5" class="stroke"/>
<text class="lbl" x="150.0" y="252.0" text-anchor="middle" opacity="1">3</text>
<circle cx="70.3" cy="201.0" r="21" fill="none" stroke="#2e7d52" stroke-width="2.5" class="stroke"/>
<text class="lbl" x="70.3" y="206.0" text-anchor="middle" opacity="1">4</text>
<circle cx="70.3" cy="109.0" r="21" fill="none" stroke="#9aa5b1" stroke-width="1.5" class="stroke"/>
<text class="lbl" x="70.3" y="114.0" text-anchor="middle" opacity="0.45">5</text>
<text class="s" x="150" y="161" text-anchor="middle" fill="#2e7d52" font-weight="600">4 de los 6 restos sirven</text>
<text class="xs" x="300" y="96" fill="#2e7d52">verde = b con ese resto SIRVE</text>
<text class="xs m" x="300" y="146">b = 1, 7, 13, 19, 25 ... todos dejan resto 1</text>
<text class="xs m" x="300" y="168">y los cinco sirven, sin excepción</text>
<text class="s mono" x="300" y="212" fill="#2f6fb5">6 | (2+b)(3+b)</text>
<text class="xs m" x="300" y="232">b = 0, 1, 3, 4 (mod 6)</text>
</svg>
