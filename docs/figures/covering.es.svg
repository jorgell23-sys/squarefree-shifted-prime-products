<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="100%" role="img" aria-labelledby="t d">
<title id="t">Quién cubre a quién</title><desc id="d">Cada primo tiene que aparecer en la suma de otro. Con b = 7, 3 cubre a 5 y 5 cubre a 3.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#1f2933}
  .m{fill:#6b7785}.s{font-size:13px}.xs{font-size:11px}
  .lbl{font-size:14px;font-weight:600}
  .big{font-size:20px;font-weight:700}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){
    text{fill:#e4e7eb}.m{fill:#9aa5b1}
    .stroke{stroke:#7b8794}
  }
</style>

<text class="xs m" x="350" y="24" text-anchor="middle">REGLA: cada primo del número tiene que dividir a la suma de alguno (puede ser la suya)</text>
<text class="s" x="30" y="66" fill="#2e7d52" font-weight="600">15 = 3 x 5 SIRVE: nadie queda solo</text>
<circle cx="90" cy="120" r="26" fill="none" stroke="#2e7d52" stroke-width="2.5" class="stroke"/>
<text class="lbl" x="90" y="126" text-anchor="middle">3</text>
<circle cx="250" cy="120" r="26" fill="none" stroke="#2e7d52" stroke-width="2.5" class="stroke"/>
<text class="lbl" x="250" y="126" text-anchor="middle">5</text>
<path d="M 118 108 Q 170 78 222 108" stroke="#2e7d52" stroke-width="2" fill="none" marker-end="url(#b)" class="stroke"/>
<path d="M 222 134 Q 170 164 118 134" stroke="#2e7d52" stroke-width="2" fill="none" marker-end="url(#b)" class="stroke"/>
<text class="xs m" x="30" y="192">3 + 7 = 10, y 5 divide a 10</text>
<text class="xs m" x="30" y="210">5 + 7 = 12, y 3 divide a 12</text>
<text class="s" x="400" y="66" fill="#c0442e" font-weight="600">21 = 3 x 7 NO SIRVE: al 7 no lo cubre nadie</text>
<circle cx="450" cy="120" r="26" fill="none" stroke="#c0442e" stroke-width="2.5" stroke-dasharray="4 3" class="stroke"/>
<text class="lbl" x="450" y="126" text-anchor="middle">3</text>
<circle cx="610" cy="120" r="26" fill="none" stroke="#9aa5b1" stroke-width="2.5" class="stroke"/>
<text class="lbl" x="610" y="126" text-anchor="middle">7</text>
<path d="M 636 100 a 26 26 0 1 1 -20 -6" stroke="#9aa5b1" stroke-width="2" fill="none" marker-end="url(#b)" class="stroke"/>
<text class="big" x="450" y="88" text-anchor="middle" fill="#c0442e">?</text>
<text class="xs m" x="400" y="192">3 + 7 = 10, 7 + 7 = 14</text>
<text class="xs m" x="400" y="210">7 divide a 14, pero 3 no divide ni a 10 ni a 14</text>
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/></marker></defs>
</svg>
